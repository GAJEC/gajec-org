map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_user_agent $link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|meta-externalagent|twitterbot|discordbot|slackbot|linkedinbot|whatsapp|telegrambot|viber|skypeuripreview|pinterest|redditbot|applebot|googlebot|google-inspectiontool|bingbot|duckduckbot|yandex|embedly|iframely|vkshare|mastodon|bluesky)" 1;
}

# Name search: 10 a minute per visitor (short bursts allowed).
limit_req_zone $client_ip zone=cert_search:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
    set $backend "${BACKEND_URL}";
    set $proxy_secret "${PROXY_SECRET}";

    include /etc/nginx/snippets/security-headers.conf;

    location ~ "^/certificate/[A-Za-z0-9]+\.(pdf|png)$" {
        proxy_pass $backend;
        include /etc/nginx/snippets/backend.conf;
    }

    location /certificate/ {
        error_page 418 = @backend;
        if ($link_preview_bot) { return 418; }

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    location = /api/certificates/search {
        limit_req zone=cert_search burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @ratelimited;
        proxy_pass $backend;
        include /etc/nginx/snippets/backend.conf;
    }

    location @ratelimited {
        add_header Retry-After 60 always;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"Too many searches. Please wait a minute and try again."}';
    }

    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/backend.conf;
    }

    location @backend {
        proxy_pass $backend;
        include /etc/nginx/snippets/backend.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;
    set $backend "${BACKEND_URL}";

    location /certificate/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/backend.conf;
    }

    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/backend.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
